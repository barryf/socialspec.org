    ### About Jordan

    I’m an outdoor enthusiast with a gift for turning an ordinary walk into an adventure. I get excited about taking [the long way home](#the-long-way). 
    
    ![Out on the trail](/img/i-love-hiking.png)
    
    JordanDoe.com is my digital garden, where I share the [places](#places), [ideas](#ideas), and [little discoveries](#links) that keep me moving. It’s my corner of the internet—a positive space to stay open to what’s ahead and remember that every path, however familiar, has something new to offer.

    The best way to reach me is [hi@jordandoe.com](mailto:hi@jordandoe.com).
